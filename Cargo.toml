[package]
name = "unoc-rs"
version = "0.1.0"
edition = "2021"
description = "Standalone APK class, method, and field mapping utility"
license-file = "LICENSE"

[lib]
name = "unoc_rs"
path = "src/lib.rs"

[[bin]]
name = "unoc-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
pretty_assertions = "1"
tempfile = "3"
